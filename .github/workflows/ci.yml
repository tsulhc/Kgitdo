name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build-fedora:
    name: Build / test / install (Fedora Plasma 6)
    runs-on: ubuntu-latest
    container:
      image: fedora:42
    steps:
      - name: Install dependencies
        run: |
          dnf install -y \
            @development-tools \
            @development-libs \
            cmake \
            extra-cmake-modules \
            kf6-kirigami-devel \
            kf6-ki18n-devel \
            kf6-kcoreaddons-devel \
            kf6-kiconthemes-devel \
            kf6-kwallet-devel \
            kf6-qqc2-desktop-style \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            qt6-qtwayland \
            patchelf \
            desktop-file-utils \
            appstream \
            git \
            curl \
            file

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate desktop entry
        run: desktop-file-validate data/org.kde.kgitdo.desktop

      - name: Validate AppStream metadata
        run: appstreamcli validate data/org.kde.kgitdo.metainfo.xml

      - name: Configure
        run: cmake -B build --install-prefix /tmp/kgitdo-install -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

      - name: Install
        run: |
          cmake --install build
          test -x /tmp/kgitdo-install/bin/kgitdo
          test -f /tmp/kgitdo-install/share/applications/org.kde.kgitdo.desktop
          test -f /tmp/kgitdo-install/share/metainfo/org.kde.kgitdo.metainfo.xml
          test -f /tmp/kgitdo-install/share/icons/hicolor/scalable/apps/org.kde.kgitdo.svg

      - name: Smoke launch (offscreen)
        run: |
          code=0
          QT_QPA_PLATFORM=offscreen timeout 5 /tmp/kgitdo-install/bin/kgitdo || code=$?
          if [ "$code" -eq 124 ]; then
            echo "offscreen smoke: app stayed alive for 5s (QML loaded, expected timeout)"
            exit 0
          else
            echo "unexpected exit code $code"
            exit 1
          fi

      - name: Package AppImage (x86_64)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1" # linuxdeploy strip cannot parse Fedora ELF .relr.dyn
          PATCHELF: "/usr/bin/patchelf" # recent Fedora patchelf preserves DT_RELR
          EXTRA_PLATFORM_PLUGINS: "libqoffscreen.so;libqwayland.so"
        run: |
          set -eux
          export QML_SOURCES_PATHS="$PWD/src" # correct container path, not host github.workspace
          mkdir -p tools dist
          curl -fL --retry 3 -o tools/linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage
          curl -fL --retry 3 -o tools/linuxdeploy-plugin-qt-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x tools/*.AppImage
          DESTDIR="$PWD/AppDir" cmake --install build --prefix /usr
          # QQC2's org.kde.desktop style is selected dynamically by C++
          # (QQuickStyle::setStyle), so a static QML scanner cannot discover it.
          # Stage it before linuxdeploy to collect its plugin dependencies.
          test -f /usr/lib64/qt6/qml/org/kde/desktop/qmldir
          mkdir -p AppDir/usr/qml/org/kde
          cp -a /usr/lib64/qt6/qml/org/kde/desktop AppDir/usr/qml/org/kde/
          # linuxdeploy's bundled patchelf is too old for Fedora's DT_RELR.
          # PATCHELF above selects the Fedora version rather than its bundled binary.
          test "$PATCHELF" = /usr/bin/patchelf
          "$PATCHELF" --version
          tools/linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          mv Kgitdo-x86_64.AppImage dist/Kgitdo-0.1.0-x86_64.AppImage
          chmod +x dist/Kgitdo-0.1.0-x86_64.AppImage
          # GitHub's Fedora container does not support FUSE mounts.
          # Inspect and run the *actual extracted AppImage payload* instead.
          dist/Kgitdo-0.1.0-x86_64.AppImage --appimage-extract >/dev/null
          test -f squashfs-root/usr/lib/libcrypt.so.2
          test -f squashfs-root/usr/plugins/platforms/libqoffscreen.so
          test -f squashfs-root/usr/plugins/platforms/libqwayland.so
          test -d squashfs-root/usr/qml/org/kde/kirigami
          test -f squashfs-root/usr/qml/org/kde/desktop/qmldir
          test -f squashfs-root/usr/share/icons/hicolor/scalable/apps/org.kde.kgitdo.svg
          payload="$PWD/squashfs-root"
          code=0
          QT_QPA_PLATFORM=offscreen timeout 5 /usr/bin/env \
            APPDIR="$payload" \
            LD_LIBRARY_PATH="$payload/usr/lib:${LD_LIBRARY_PATH:-}" \
            QT_PLUGIN_PATH="$payload/usr/plugins" \
            QML_IMPORT_PATH="$payload/usr/qml" \
            QML2_IMPORT_PATH="$payload/usr/qml" \
            QT_QPA_PLATFORM=offscreen \
            QT_DEBUG_PLUGINS=1 \
            QML_IMPORT_TRACE=1 \
            "$payload/AppRun" || code=$?
          if [ "$code" -ne 124 ]; then
            echo "Extracted AppImage payload failed smoke: status $code"
            echo "Bundled QML top-level modules:"
            find "$payload/usr/qml" -maxdepth 3 -name qmldir | sort | head -65
            echo "Bundled Qt configuration:"
            find "$payload/usr" -name qt.conf -exec sh -c 'echo "$1"; cat "$1"' _ {} \;
            echo "AppRun wrapped binary details:"
            file "$payload/AppRun.wrapped"
            exit 1
          fi
          echo "Bundled AppImage payload remained alive for 5 seconds"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kgitdo-0.1.0-x86_64
          path: dist/Kgitdo-0.1.0-x86_64.AppImage
          if-no-files-found: error

  publish-release:
    # Creating a version tag is a separate operator authorization step.
    # Never publish from a PR, normal main push, or an unverified RC.
    if: github.ref == 'refs/tags/v0.1.0'
    needs: build-fedora
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested AppImage
        uses: actions/download-artifact@v4
        with:
          name: Kgitdo-0.1.0-x86_64
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: Kgitdo-0.1.0-x86_64.AppImage
          fail_on_unmatched_files: true
          generate_release_notes: true
